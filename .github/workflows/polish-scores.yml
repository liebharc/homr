name: Polish scores

# Runs the Polish scores benchmark. On main the result is cached as the baseline,
# on PRs it's compared against the newest main result in the job summary.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: polish-scores-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            poetry.lock

      - name: Install poetry
        run: |
          python -m pip install poetry

      - name: Init
        run: make init-poetry

      - name: Download models
        run: poetry run homr --init --gpu no

      - name: Benchmark
        env:
          PYTHONUNBUFFERED: 1  # Print the progress immediately
        run: poetry run python -m validation.polish-scores --tool homr --output polish.db

      - name: Store main result
        if: github.ref == 'refs/heads/main'
        run: cp polish.db polish-main.db

      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: polish-main.db
          key: polish-main-${{ github.sha }}

      - name: Load main result
        if: github.ref != 'refs/heads/main'
        id: main
        uses: actions/cache/restore@v4
        with:
          path: polish-main.db
          key: polish-main-${{ github.event.pull_request.base.sha }}
          restore-keys: polish-main-

      - name: Compare with main
        if: github.ref != 'refs/heads/main'
        run: |
          if [ -f polish-main.db ]; then
            echo "Compared with ${{ steps.main.outputs.cache-matched-key }}" >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ steps.main.outputs.cache-hit }}" != "true" ]; then
              echo "⚠️ No result for main at ${{ github.event.pull_request.base.sha }} yet, the difference includes changes on main" >> "$GITHUB_STEP_SUMMARY"
            fi
            poetry run python -m validation.compare_benchmarks polish.db --base polish-main.db >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No main result cached yet" >> "$GITHUB_STEP_SUMMARY"
            poetry run python -m validation.compare_benchmarks polish.db >> "$GITHUB_STEP_SUMMARY"
          fi
